[package]
name = "desktop"
version = "0.1.0"
description = "Blueflutes desktop app"
authors = ["Blueflutes"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-keyring = "0.1"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Windows/Linux dispatch the OAuth deep link as CLI args to a new process
# instance; this plugin forwards them to the already-running instance so
# tauri-plugin-deep-link's onOpenUrl listener fires (macOS handles this
# natively via LSApplicationCategoryType / Info.plist association).
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

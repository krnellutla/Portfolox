# Render blueprint for Portfolix. Secrets marked sync: false are entered in the
# Render dashboard and never committed.
services:
  - type: web
    name: portfolix
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Database (Supabase). DATABASE_URL is the pooled connection used at runtime
      # by the restricted app role; DATABASE_MIGRATION_URL is only needed by the
      # API process to satisfy config validation and is the same project's direct URL.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_MIGRATION_URL
        sync: false
      - key: DB_APP_ROLE
        value: blueflutes_app
      - key: DB_APP_ROLE_PASSWORD
        sync: false
      - key: DB_POOL_MAX
        value: "5"
      # Auth
      - key: JWT_SECRET
        generateValue: true
      - key: OAUTH_REDIRECT_BASE_URL
        value: https://portfolix.tinkeryard.dev/api
      - key: WEB_APP_URL
        value: https://portfolix.tinkeryard.dev
      - key: AUTH_COOKIE_PATH
        value: /api/auth
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Storage (Supabase Storage through its S3-compatible endpoint)
      - key: STORAGE_PROVIDER
        value: s3
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_PUBLIC_BASE_URL
        sync: false
      # Origin allowed by the page's Content-Security-Policy for image loads and uploads,
      # for example https://abcdwxyz.supabase.co
      - key: STORAGE_ORIGIN
        sync: false
